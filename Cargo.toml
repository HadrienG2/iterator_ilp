[package]
name = "iterator_ilp"
#
# Release checklist:
#
# - Cross-check all public API documentation, update as needed
# - Update changelog
# - Update version number in Cargo.toml
# - Push branch, make PR, automerge on CI success
# - Cargo publish
# - Roll an annotated git tag
# - Add a github release
#
version = "2.1.3"
authors = ["Hadrien G. <knights_of_ni@gmx.com>"]
edition = "2021"
rust-version = "1.75.0"
description = "Iterator extensions for instruction-parallel reductions"
repository = "https://github.com/HadrienG2/iterator_ilp"
license = "MPL-2.0"
keywords = ["iterator", "ilp", "instruction-parallel", "simd", "unroll"]
categories = ["algorithms", "concurrency", "mathematics", "no-std::no-alloc", "rust-patterns"]

[features]
default = ["std"]
std = []

[dependencies]
num-traits = "0.2"

[dev-dependencies]
# TODO: Update criterion once ready to bump MSRV to 1.86.
criterion = { version = "<0.8", default-features = false }
hwlocality = "1.0.0-alpha.11"
multiversion = "0.8"
# TODO: Update proptest once ready to bump MSRV. proptest v1.9 requires rust
#       1.82, proptest v1.10 requires rust 1.84.
proptest = { version = "<1.9", default-features = false, features = ["handle-panics", "std"] }
# TODO: Update rand once ready to bump MSRV to 1.85.
rand = "<0.10"
static_assertions = "1.1.0"

[[bench]]
name = "benchmark"
harness = false

[profile.bench]
codegen-units = 1

[profile.test.package.proptest]
opt-level = 3

[profile.test.package.rand_chacha]
opt-level = 3

